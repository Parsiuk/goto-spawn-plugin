stages:
  - lint
  - build
  - release

lint:
  stage: lint
  image: maven:3-eclipse-temurin-21
  script:
    - mvn checkstyle:check -q
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

build:
  stage: build
  image: maven:3-eclipse-temurin-21
  script:
    - mvn clean package -q
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apk add --no-cache curl
    - JAR_FILE=$(ls target/*.jar | head -1)
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$JAR_FILE"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/goto-spawn-plugin/${CI_COMMIT_TAG}/goto-spawn-plugin-${CI_COMMIT_TAG}.jar"'
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "goto-spawn-plugin-${CI_COMMIT_TAG}.jar"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/goto-spawn-plugin/${CI_COMMIT_TAG}/goto-spawn-plugin-${CI_COMMIT_TAG}.jar"
