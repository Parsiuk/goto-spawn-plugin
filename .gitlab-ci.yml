stages:
  - lint
  - build
  - release

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

lint:
  stage: lint
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn validate compile -DskipTests

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

build-release:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests
    - mv target/goto-spawn-plugin-*.jar target/goto-spawn-${CI_COMMIT_TAG}.jar
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file target/goto-spawn-${CI_COMMIT_TAG}.jar \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/goto-spawn/${CI_COMMIT_TAG}/goto-spawn-${CI_COMMIT_TAG}.jar"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build-release
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "goto-spawn-${CI_COMMIT_TAG}.jar"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/goto-spawn/${CI_COMMIT_TAG}/goto-spawn-${CI_COMMIT_TAG}.jar"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
