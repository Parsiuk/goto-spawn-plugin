stages:
  - lint
  - build
  - release

cache:
  paths:
    - .gradle/

lint:
  stage: lint
  image: eclipse-temurin:25
  script:
    - ./gradlew classes

build:
  stage: build
  image: eclipse-temurin:25
  script:
    - ./gradlew clean jar
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

build-release:
  stage: build
  image: eclipse-temurin:25
  script:
    - ./gradlew clean jar
    - mv build/libs/goto-spawn-plugin-*.jar build/libs/goto-spawn-${CI_COMMIT_TAG}.jar
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file build/libs/goto-spawn-${CI_COMMIT_TAG}.jar \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/goto-spawn/${CI_COMMIT_TAG}/goto-spawn-${CI_COMMIT_TAG}.jar"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build-release
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "goto-spawn-${CI_COMMIT_TAG}.jar"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/goto-spawn/${CI_COMMIT_TAG}/goto-spawn-${CI_COMMIT_TAG}.jar"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
