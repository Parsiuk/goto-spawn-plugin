name: GotoSpawn
version: '${version}'
main: com.gotospawn.GotoSpawnPlugin
api-version: '26.2'
description: Teleport between spawn and bed with /goto command

commands:
  goto:
    description: Teleport to spawn or bed
    usage: /<command> <spawn|bed>
  gotoreload:
    description: Reload GotoSpawn configuration
    usage: /<command>
    permission: goto.admin

permissions:
  goto.admin:
    description: Allows reloading GotoSpawn configuration
    default: op
