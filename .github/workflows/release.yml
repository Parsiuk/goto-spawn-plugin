name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean jar
      - name: Rename jar
        run: mv build/libs/goto-spawn-plugin-*.jar build/libs/goto-spawn-${GITHUB_REF_NAME}.jar
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/goto-spawn-${{ github.ref_name }}.jar
